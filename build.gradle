plugins {
    // kotlin + kotlin-spring
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.0'
    // id 'org.jetbrains.kotlin.plugin.allopen' version '2.3.0'

    // spring boot
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'

    id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.0'
    id 'org.jetbrains.kotlin.kapt' version '2.3.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'

    implementation 'org.springframework.data:spring-data-envers'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    // tool for dynamic page creation instead jsp
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // tool for validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // tool for generating REST api doc, test page
    // use http://localhost:8080/v3/api-docs to generate JSON doc
    // use http://localhost:8080/swagger-ui/index.html for web test page
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // tool for roll out and update database schema
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    // instead of org.hibernate:hibernate-jpamodelgen better use querydsl
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
    kapt 'io.github.openfeign.querydsl:querydsl-apt:7.1:jakarta'
    kapt 'io.github.openfeign.querydsl:querydsl-kotlin-codegen:7.1'

    // kotlin reflection
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
//    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'io.mockk:mockk:1.14.7'
    testImplementation 'org.testcontainers:postgresql:1.19.8'

}

kotlin {
    jvmToolchain(22)
}

tasks.named('test') {
    useJUnitPlatform()
}