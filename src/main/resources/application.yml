db:
  username: postgres
  driver: PostgresDriver
  url: postgres:5432
  hosts: localhost,127.0.0.1
  pool:
    size: 12
    timeout: 100
  pools:
    - size: 1
      timeout: 1
    - size: 2
      timeout: 2

#spring.profiles.active: qa
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/
    username: postgres
    password: pass
    driver-class-name: org.postgresql.Driver
  jpa:
    properties.hibernate:
      show_sql: true
      format_sql: true