<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User</title>
</head>
<body>
    <div th:insert="~{fragments::header}"></div>
    <form th:action="@{/users/{userId}/update(userId=${user.id})}" enctype="multipart/form-data" method="post" th:object="${user}">
        <label title="Email">
            <input id="email" name="email" type="email" th:value="${user.email}">
        </label><br/>
        <label title="Name">
            <input id="firstName" name="firstName" type="text" th:value="*{firstName}">
        </label><br/>
        <label title="Lastname">
            <input id="lastName" name="lastName" type="text" th:value="*{lastName}">
        </label><br/>
        <label title="Birth Date">
            <input id="birthDate" name="birthDate" type="date" th:value="*{birthDate}">
        </label><br/>
        <label title="Avatar">Avatar:
            <input id="image" name="image" type="file">
        </label><br/>
        <div th:if="${user.image != null}" >
            <span th:text="@{/image/{imageName}(imageName=${user.image})}">Text</span><br/>
            <img th:src="@{/image/{imageName}(imageName=${user.image})}" alt="Avatar">
        </div>
        <div th:each="role : ${roles}">
            <input type="radio"
                   name="role"
                   th:id="${role}"
                   th:value="${role}"
                   th:checked="${role == user.role}" />
            <label th:for="${role}" th:text="${role}">Role name</label>
        </div>
        <label title="Company">
            <select id="companyId" name="companyId">
                <option th:value="0"
                        th:text="None"
                        th:selected="${null == user.company}">None</option>
                <option th:each="c : ${companies}"
                        th:value="${c.id}"
                        th:text="${c.name}"
                        th:selected="${user.company != null && c.id == user.company.id}">GOOGLE</option>
            </select>
        </label><br/>
        <button type="submit">Update</button>
    </form>
    <form th:action="@{/users/{userId}/delete(userId=${user.id})}" th:if="${user.role.name == 'ADMIN'}" method="post">
        <button type="submit">Remove</button>
    </form>
</body>
</html>
